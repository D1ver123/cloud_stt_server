[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaozhi-cloud-stt-client"
version = "0.1.0"
description = "Client-side audio capture and streaming pipeline for xiaozhi-cloud-stt"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.24",
    "pydantic>=2.6",
    "websockets>=12.0",
    "uvicorn[standard]>=0.27",
    "dashscope>=1.20",
    "funasr>=1.3.1",
    "modelscope>=1.20",
    "torch>=2.0",
    "torchaudio>=2.0",
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.4.6",
]
opus = [
    "opuslib==3.0.1",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cloud-stt-client = "cloud_stt_client.cli:main"
cloud-stt-server = "cloud_stt_server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
