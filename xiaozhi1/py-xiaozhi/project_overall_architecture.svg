<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1350" viewBox="0 0 1900 1350">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 30px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #182230; }
      .subtitle { font: 15px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #5b6675; }
      .layer { fill: #ffffff; stroke: #d2dae6; stroke-width: 1.2; rx: 10; }
      .layer-title { font: 700 18px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #263243; }
      .box { fill: #ffffff; stroke: #aeb8c8; stroke-width: 1.2; rx: 7; }
      .entry { fill: #eef7ff; stroke: #5aa0d8; }
      .core { fill: #f7f1ff; stroke: #8c6ac6; }
      .plugin { fill: #f2f8f0; stroke: #6daf62; }
      .domain { fill: #fff8e7; stroke: #d6a340; }
      .protocol { fill: #eef9f8; stroke: #4ca5a0; }
      .support { fill: #f4f5f7; stroke: #98a2b3; }
      .external { fill: #fff1eb; stroke: #d2845e; }
      .design { fill: #fff0f0; stroke: #c86767; stroke-dasharray: 5 4; }
      .box-title { font: 700 15px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #1f2a37; }
      .box-text { font: 12.5px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #3b4656; }
      .small { font: 12px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #647084; }
      .arrow { stroke: #465365; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #7a8799; stroke-width: 1.6; fill: none; marker-end: url(#arrowSoft); }
      .arrow-dashed { stroke: #7a8799; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrowSoft); }
      .legend-text { font: 12px "Microsoft YaHei", "Segoe UI", Arial, sans-serif; fill: #384456; }
      .code { font: 12px Consolas, "Courier New", monospace; fill: #26313f; }
      .divider { stroke: #ccd4df; stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#465365"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8799"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1900" height="1350"/>

  <text class="title" x="70" y="55">py-xiaozhi 项目整体架构图</text>
  <text class="subtitle" x="70" y="84">按运行时层级关系绘制：启动初始化 → Application 编排 → 插件事件总线 → 业务能力 → 协议/外部服务 → 配置资源与原生库。虚线表示条件或可选关系。</text>

  <rect class="box support" x="1390" y="30" width="430" height="82"/>
  <text class="box-title" x="1410" y="57">图例</text>
  <rect class="entry" x="1410" y="72" width="18" height="12"/><text class="legend-text" x="1436" y="83">入口/初始化</text>
  <rect class="core" x="1530" y="72" width="18" height="12"/><text class="legend-text" x="1556" y="83">应用核心</text>
  <rect class="plugin" x="1630" y="72" width="18" height="12"/><text class="legend-text" x="1656" y="83">插件层</text>
  <rect class="domain" x="1410" y="92" width="18" height="12"/><text class="legend-text" x="1436" y="103">领域能力</text>
  <rect class="protocol" x="1530" y="92" width="18" height="12"/><text class="legend-text" x="1556" y="103">协议层</text>
  <rect class="external" x="1630" y="92" width="18" height="12"/><text class="legend-text" x="1656" y="103">外部系统</text>

  <!-- Layer 1 -->
  <rect class="layer" x="55" y="130" width="1790" height="150"/>
  <text class="layer-title" x="80" y="160">1. 启动与系统初始化层</text>

  <rect class="box entry" x="85" y="185" width="260" height="70"/>
  <text class="box-title" x="105" y="212">main.py</text>
  <text class="box-text" x="105" y="236">解析 mode / protocol</text>
  <text class="box-text" x="105" y="253">创建 asyncio 或 qasync 事件循环</text>

  <rect class="box entry" x="405" y="185" width="290" height="70"/>
  <text class="box-title" x="425" y="212">SystemInitializer</text>
  <text class="box-text" x="425" y="236">设备指纹 / 配置 / OTA</text>
  <text class="box-text" x="425" y="253">决定是否进入激活流程</text>

  <rect class="box entry" x="755" y="185" width="270" height="70"/>
  <text class="box-title" x="775" y="212">激活视图</text>
  <text class="box-text" x="775" y="236">GUI: ActivationWindow</text>
  <text class="box-text" x="775" y="253">CLI: CLIActivation</text>

  <rect class="box support" x="1085" y="185" width="280" height="70"/>
  <text class="box-title" x="1105" y="212">ConfigManager</text>
  <text class="box-text" x="1105" y="236">config/config.json</text>
  <text class="box-text" x="1105" y="253">CLIENT_ID / DEVICE_ID / 网络配置</text>

  <rect class="box external" x="1425" y="185" width="300" height="70"/>
  <text class="box-title" x="1445" y="212">OTA / 激活服务</text>
  <text class="box-text" x="1445" y="236">获取 WebSocket/MQTT 配置</text>
  <text class="box-text" x="1445" y="253">返回激活信息</text>

  <path class="arrow" d="M345 220 H405"/>
  <path class="arrow-dashed" d="M695 220 H755"/>
  <text class="small" x="708" y="210">需要激活时</text>
  <path class="arrow-soft" d="M695 235 H1085"/>
  <path class="arrow-soft" d="M695 205 C930 150, 1235 150, 1425 205"/>

  <!-- Layer 2 -->
  <rect class="layer" x="55" y="310" width="1790" height="160"/>
  <text class="layer-title" x="80" y="340">2. Application 编排层</text>

  <rect class="box core" x="85" y="365" width="330" height="78"/>
  <text class="box-title" x="105" y="392">Application 单例</text>
  <text class="box-text" x="105" y="416">状态机: IDLE / LISTENING / SPEAKING</text>
  <text class="box-text" x="105" y="434">任务池、连接锁、关停事件</text>

  <rect class="box core" x="485" y="365" width="320" height="78"/>
  <text class="box-title" x="505" y="392">Protocol 选择与回调接入</text>
  <text class="box-text" x="505" y="416">WebsocketProtocol 或 MqttProtocol</text>
  <text class="box-text" x="505" y="434">incoming_json / incoming_audio</text>

  <rect class="box core" x="875" y="365" width="330" height="78"/>
  <text class="box-title" x="895" y="392">PluginManager</text>
  <text class="box-text" x="895" y="416">按 priority 注册与启动插件</text>
  <text class="box-text" x="895" y="434">统一广播 JSON / audio / state</text>

  <rect class="box core" x="1275" y="365" width="330" height="78"/>
  <text class="box-title" x="1295" y="392">对话控制入口</text>
  <text class="box-text" x="1295" y="416">手动按住 / 自动对话 / 中止播放</text>
  <text class="box-text" x="1295" y="434">send_start_listening / abort</text>

  <path class="arrow" d="M250 280 V365"/>
  <path class="arrow" d="M415 392 H485"/>
  <path class="arrow" d="M415 421 C575 470, 720 470, 875 421"/>
  <path class="arrow-soft" d="M1205 404 H1275"/>
  <text class="small" x="1244" y="388">UI / 唤醒词 / 快捷键调用</text>

  <!-- Layer 3 -->
  <rect class="layer" x="55" y="500" width="1790" height="205"/>
  <text class="layer-title" x="80" y="530">3. 插件层：Application 的事件总线扩展点</text>

  <rect class="box plugin" x="85" y="555" width="215" height="105"/>
  <text class="box-title" x="105" y="582">AudioPlugin</text>
  <text class="box-text" x="105" y="606">初始化 AudioCodec</text>
  <text class="box-text" x="105" y="624">上传麦克风音频</text>
  <text class="box-text" x="105" y="642">播放服务端音频</text>

  <rect class="box plugin" x="330" y="555" width="215" height="105"/>
  <text class="box-title" x="350" y="582">McpPlugin</text>
  <text class="box-text" x="350" y="606">注册 MCP 工具</text>
  <text class="box-text" x="350" y="624">处理 type=mcp</text>
  <text class="box-text" x="350" y="642">回传工具结果</text>

  <rect class="box plugin" x="575" y="555" width="215" height="105"/>
  <text class="box-title" x="595" y="582">WakeWordPlugin</text>
  <text class="box-text" x="595" y="606">连接唤醒词检测器</text>
  <text class="box-text" x="595" y="624">检测后启动自动对话</text>
  <text class="box-text" x="595" y="642">可中止当前播报</text>

  <rect class="box plugin" x="820" y="555" width="215" height="105"/>
  <text class="box-title" x="840" y="582">IoTPlugin</text>
  <text class="box-text" x="840" y="606">初始化 Thing 设备</text>
  <text class="box-text" x="840" y="624">上报 descriptors/states</text>
  <text class="box-text" x="840" y="642">执行 type=iot 命令</text>

  <rect class="box plugin" x="1065" y="555" width="215" height="105"/>
  <text class="box-title" x="1085" y="582">SttForwarderPlugin</text>
  <text class="box-text" x="1085" y="606">处理 type=stt</text>
  <text class="box-text" x="1085" y="624">保存 last_text</text>
  <text class="box-text" x="1085" y="642">队列 / 回调订阅</text>

  <rect class="box plugin" x="1310" y="555" width="215" height="105"/>
  <text class="box-title" x="1330" y="582">UIPlugin</text>
  <text class="box-text" x="1330" y="606">创建 GUI 或 CLI display</text>
  <text class="box-text" x="1330" y="624">绑定交互回调</text>
  <text class="box-text" x="1330" y="642">更新文本/表情/状态</text>

  <rect class="box plugin" x="1555" y="555" width="215" height="105"/>
  <text class="box-title" x="1575" y="582">Shortcuts / Calendar</text>
  <text class="box-text" x="1575" y="606">全局快捷键入口</text>
  <text class="box-text" x="1575" y="624">日程提醒服务</text>
  <text class="box-text" x="1575" y="642">插件生命周期托管</text>

  <rect class="box design" x="1065" y="675" width="460" height="42"/>
  <text class="box-title" x="1085" y="701">开发设计扩展：意图识别 + Adapter</text>
  <text class="box-text" x="1320" y="701">STT 文本 → 指令意图 → 目标机器个体</text>

  <path class="arrow" d="M1040 443 V520"/>
  <path class="arrow-soft" d="M1040 520 H193 V555"/>
  <path class="arrow-soft" d="M1040 520 H437 V555"/>
  <path class="arrow-soft" d="M1040 520 H682 V555"/>
  <path class="arrow-soft" d="M1040 520 H927 V555"/>
  <path class="arrow-soft" d="M1040 520 H1172 V555"/>
  <path class="arrow-soft" d="M1040 520 H1417 V555"/>
  <path class="arrow-soft" d="M1040 520 H1662 V555"/>
  <path class="arrow-soft" d="M1172 660 V675"/>

  <!-- Layer 4 -->
  <rect class="layer" x="55" y="735" width="1790" height="220"/>
  <text class="layer-title" x="80" y="765">4. 业务能力与领域模块层</text>

  <rect class="box domain" x="85" y="790" width="300" height="105"/>
  <text class="box-title" x="105" y="817">音频编解码与播放</text>
  <text class="box-text" x="105" y="841">AudioCodec: InputStream / OutputStream</text>
  <text class="box-text" x="105" y="859">Opus 编码解码、重采样、队列</text>
  <text class="box-text" x="105" y="877">AECProcessor 可选</text>

  <rect class="box domain" x="425" y="790" width="300" height="105"/>
  <text class="box-title" x="445" y="817">唤醒词与本地音频处理</text>
  <text class="box-text" x="445" y="841">WakeWordDetector</text>
  <text class="box-text" x="445" y="859">Sherpa-ONNX KeywordSpotter</text>
  <text class="box-text" x="445" y="877">models/encoder, decoder, joiner</text>

  <rect class="box domain" x="765" y="790" width="300" height="105"/>
  <text class="box-title" x="785" y="817">IoT Thing 模型</text>
  <text class="box-text" x="785" y="841">ThingManager</text>
  <text class="box-text" x="785" y="859">Thing / Property / Method</text>
  <text class="box-text" x="785" y="877">things/lamp.py 等具体设备</text>

  <rect class="box domain" x="1105" y="790" width="300" height="105"/>
  <text class="box-title" x="1125" y="817">MCP 工具系统</text>
  <text class="box-text" x="1125" y="841">McpServer</text>
  <text class="box-text" x="1125" y="859">tools: system / timer / music</text>
  <text class="box-text" x="1125" y="877">camera / calendar / bazi 等</text>

  <rect class="box domain" x="1445" y="790" width="300" height="105"/>
  <text class="box-title" x="1465" y="817">显示与视图</text>
  <text class="box-text" x="1465" y="841">display: Base / GUI / CLI</text>
  <text class="box-text" x="1465" y="859">views: activation / settings</text>
  <text class="box-text" x="1465" y="877">assets/emojis 与 QML</text>

  <rect class="box domain" x="85" y="910" width="1660" height="32"/>
  <text class="box-text" x="105" y="931">这些模块不直接决定主流程；它们通过插件层被 Application 调用，或者通过协议消息与服务端协作。</text>

  <path class="arrow-soft" d="M193 660 V790"/>
  <path class="arrow-soft" d="M682 660 V790"/>
  <path class="arrow-soft" d="M927 660 V790"/>
  <path class="arrow-soft" d="M437 660 C437 720, 1255 720, 1255 790"/>
  <path class="arrow-soft" d="M1417 660 V790"/>

  <!-- Layer 5 -->
  <rect class="layer" x="55" y="985" width="1790" height="190"/>
  <text class="layer-title" x="80" y="1015">5. 协议通信与外部服务层</text>

  <rect class="box protocol" x="85" y="1040" width="330" height="88"/>
  <text class="box-title" x="105" y="1067">WebsocketProtocol</text>
  <text class="box-text" x="105" y="1091">WSS 连接、hello 握手</text>
  <text class="box-text" x="105" y="1109">JSON 消息 + 二进制音频帧</text>

  <rect class="box protocol" x="455" y="1040" width="330" height="88"/>
  <text class="box-title" x="475" y="1067">MqttProtocol</text>
  <text class="box-text" x="475" y="1091">MQTT 控制消息</text>
  <text class="box-text" x="475" y="1109">UDP + AES-CTR 音频传输</text>

  <rect class="box external" x="825" y="1040" width="300" height="88"/>
  <text class="box-title" x="845" y="1067">小智服务端</text>
  <text class="box-text" x="845" y="1091">ASR/STT、LLM、TTS</text>
  <text class="box-text" x="845" y="1109">返回 stt / tts / llm / iot / mcp</text>

  <rect class="box external" x="1165" y="1040" width="280" height="88"/>
  <text class="box-title" x="1185" y="1067">外部 API / 在线服务</text>
  <text class="box-text" x="1185" y="1091">音乐、搜索、地图、铁路等</text>
  <text class="box-text" x="1185" y="1109">由 MCP 工具按需访问</text>

  <rect class="box external" x="1485" y="1040" width="260" height="88"/>
  <text class="box-title" x="1505" y="1067">本地系统能力</text>
  <text class="box-text" x="1505" y="1091">摄像头、音量、应用管理</text>
  <text class="box-text" x="1505" y="1109">设备音频输入/输出</text>

  <path class="arrow-dashed" d="M645 443 C645 745, 250 745, 250 1040"/>
  <path class="arrow-dashed" d="M645 443 C645 745, 620 745, 620 1040"/>
  <text class="small" x="665" y="1010">按 --protocol 二选一</text>
  <path class="arrow" d="M415 1072 C550 1018, 690 1018, 825 1072"/>
  <path class="arrow" d="M785 1098 H825"/>
  <path class="arrow-dashed" d="M1255 895 C1255 955, 1305 980, 1305 1040"/>
  <path class="arrow-dashed" d="M1595 895 C1595 960, 1615 990, 1615 1040"/>

  <!-- Layer 6 -->
  <rect class="layer" x="55" y="1205" width="1790" height="95"/>
  <text class="layer-title" x="80" y="1235">6. 支撑资源层</text>

  <rect class="box support" x="85" y="1250" width="250" height="35"/>
  <text class="box-text" x="105" y="1273">config/: config.json / efuse.json</text>
  <rect class="box support" x="375" y="1250" width="245" height="35"/>
  <text class="box-text" x="395" y="1273">models/: Sherpa-ONNX 模型</text>
  <rect class="box support" x="660" y="1250" width="255" height="35"/>
  <text class="box-text" x="680" y="1273">libs/: opus / webrtc_apm</text>
  <rect class="box support" x="955" y="1250" width="245" height="35"/>
  <text class="box-text" x="975" y="1273">assets/: 图标 / 表情资源</text>
  <rect class="box support" x="1240" y="1250" width="235" height="35"/>
  <text class="box-text" x="1260" y="1273">cache/ logs/ scripts/</text>
  <rect class="box support" x="1515" y="1250" width="230" height="35"/>
  <text class="box-text" x="1535" y="1273">requirements / build.json</text>

  <line class="divider" x1="70" y1="1315" x2="1830" y2="1315"/>
  <text class="small" x="75" y="1335">源码依据：main.py；src/application.py；src/plugins/*；src/audio_codecs/*；src/audio_processing/wake_word_detect.py；src/protocols/*；src/iot/*；src/mcp/*；src/display/*；src/core/*；src/utils/config_manager.py。</text>
</svg>
