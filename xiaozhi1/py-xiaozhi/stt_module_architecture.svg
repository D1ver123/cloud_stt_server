  <path class="arrow" d="M670 922 C695 922, 695 836, 720 836"/>
  <path class="arrow" d="M990 836 H1040"/>
  <path class="arrow" d="M1335 816 H1390"/>
  <path class="arrow" d="M1525 837 V865"/>
  <path class="arrow" d="M1525 977 V1010"/>
  <path class="arrow-soft" d="M990 852 C1010 915, 1015 981, 1040 981"/>

  <line class="divider" x1="75" y1="1150" x2="1705" y2="1150"/>

  <text class="section-title" x="75" y="1182">源码依据</text>
  <text class="small" x="75" y="1207">依据 1: AudioCodec 输入链路见 src/audio_codecs/audio_codec.py:328, 363, 405, 574, 593。</text>
  <text class="small" x="75" y="1229">依据 2: 发送门控见 src/plugins/audio.py:39, 193, 208, 224, 231；状态判断见 src/application.py:414。</text>
  <text class="small" x="75" y="1251">依据 3: 协议收发见 src/protocols/websocket_protocol.py:372, 409；src/protocols/mqtt_protocol.py:430, 530。</text>
  <text class="small" x="75" y="1273">依据 4: Application 接入 SttForwarderPlugin，新增 src/plugins/stt_forwarder.py；上游插件目录无 stt_forwarder.py。</text>
  <text class="small" x="75" y="1295">设计标注：意图识别 + Adapter 是新增开发模块设计，放在 STT 文本输出之后，路由到 ThingManager / Thing 个体。</text>
</svg>
