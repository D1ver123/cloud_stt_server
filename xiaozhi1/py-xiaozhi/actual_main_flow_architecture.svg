<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #162033; }
      .subtitle { font: 400 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #667085; }
      .section { fill: #ffffff; stroke: #d7dce5; stroke-width: 1.5; rx: 18; }
      .section-title { font: 700 18px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #263247; }
      .section-note { font: 400 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #667085; }
      .box { fill: #ffffff; stroke: #aeb8c8; stroke-width: 1.4; rx: 12; filter: url(#shadow); }
      .box-title { font: 700 15.5px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .box-text { font: 400 12.5px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #4b5565; }
      .label { font: 700 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #344054; }
      .small { font: 400 11.5px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #667085; }
      .blue { fill: #eef6ff; stroke: #7bb7f0; }
      .purple { fill: #f4f0ff; stroke: #a996e8; }
      .green { fill: #ecfdf5; stroke: #38b27a; }
      .amber { fill: #fff7e8; stroke: #f0bc62; }
      .red { fill: #fff1f2; stroke: #ee8d9a; }
      .gray { fill: #f8fafc; stroke: #b8c2d0; }
      .adapter { fill: #eefaf2; stroke: #16a34a; stroke-width: 2; }
      .arrow { stroke: #48566a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-green { stroke: #20845a; stroke-width: 2.1; fill: none; marker-end: url(#arrow-green); }
      .arrow-red { stroke: #b42318; stroke-width: 2; fill: none; marker-end: url(#arrow-red); }
      .arrow-soft { stroke: #8a94a6; stroke-width: 1.7; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow-soft); }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#48566a"/>
    </marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#20845a"/>
    </marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#b42318"/>
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#8a94a6"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="980"/>
  <text class="title" x="70" y="60">语音输入到 STT 文本 Adapter 流程图</text>
  <text class="subtitle" x="70" y="90">范围收敛：只展示麦克风输入、发送服务端转文字、接收 type=stt、进入 SttForwarderPlugin/Adapter 并输出给其他模块。</text>

  <rect class="box gray" x="1180" y="42" width="520" height="78"/>
  <text class="box-title" x="1206" y="68">边界说明</text>
  <text class="box-text" x="1206" y="90">客户端不做本地普通 STT；STT 文本由服务端返回 JSON: {"type":"stt","text":"..."}</text>
  <text class="box-text" x="1206" y="108">Adapter 对应当前新增的 SttForwarderPlugin。</text>

  <!-- Section 1 -->
  <rect class="section" x="70" y="150" width="1660" height="170"/>
  <text class="section-title" x="100" y="184">1. 语音输入与音频标准化</text>
  <text class="section-note" x="100" y="204">目标：把设备原生麦克风数据转换为服务端协议可接收的 Opus 音频。</text>

  <rect class="box blue" x="115" y="230" width="210" height="62"/>
  <text class="box-title" x="140" y="253">麦克风输入</text>
  <text class="box-text" x="140" y="273">系统输入设备</text>
  <rect class="box blue" x="390" y="230" width="245" height="62"/>
  <text class="box-title" x="415" y="253">SoundDevice InputStream</text>
  <text class="box-text" x="415" y="273">低延迟采集 callback</text>
  <rect class="box blue" x="700" y="230" width="270" height="62"/>
  <text class="box-title" x="725" y="253">AudioCodec 输入转换</text>
  <text class="box-text" x="725" y="273">下混 / 重采样 16kHz / int16</text>
  <rect class="box blue" x="1035" y="230" width="230" height="62"/>
  <text class="box-title" x="1060" y="253">Opus 编码</text>
  <text class="box-text" x="1060" y="273">encoded_callback</text>
  <rect class="box blue" x="1330" y="230" width="280" height="62"/>
  <text class="box-title" x="1355" y="253">AudioPlugin 上传门控</text>
  <text class="box-text" x="1355" y="273">LISTENING 时才允许发送</text>

  <path class="arrow" d="M325 261 H390"/>
  <path class="arrow" d="M635 261 H700"/>
  <path class="arrow" d="M970 261 H1035"/>
  <path class="arrow" d="M1265 261 H1330"/>

  <text class="label" x="1395" y="335">输出：已编码的麦克风 Opus 音频</text>
  <path class="arrow-green" d="M1470 292 V365"/>

  <!-- Section 2 -->
  <rect class="section" x="70" y="365" width="1660" height="165"/>
  <text class="section-title" x="100" y="399">2. 音频发送到服务端进行 STT</text>
  <text class="section-note" x="100" y="419">目标：客户端只上传音频；普通语音转文字由小智服务端完成。</text>

  <rect class="box purple" x="220" y="445" width="285" height="62"/>
  <text class="box-title" x="245" y="468">Protocol.send_audio()</text>
  <text class="box-text" x="245" y="488">WebSocket bytes / MQTT UDP</text>
  <rect class="box purple" x="585" y="445" width="285" height="62"/>
  <text class="box-title" x="610" y="468">网络传输</text>
  <text class="box-text" x="610" y="488">音频帧持续上行</text>
  <rect class="box green" x="950" y="435" width="320" height="82"/>
  <text class="box-title" x="975" y="458">小智服务端</text>
  <text class="box-text" x="975" y="478">STT：音频转文字</text>
  <text class="box-text" x="975" y="497">后续可能继续 LLM/TTS</text>
  <rect class="box green" x="1350" y="445" width="260" height="62"/>
  <text class="box-title" x="1375" y="468">返回 STT JSON</text>
  <text class="box-text" x="1375" y="488">{"type":"stt","text":"..."}</text>

  <path class="arrow" d="M505 476 H585"/>
  <path class="arrow" d="M870 476 H950"/>
  <path class="arrow-green" d="M1270 476 H1350"/>
  <path class="arrow-green" d="M1480 507 V560"/>

  <!-- Section 3 -->
  <rect class="section" x="70" y="560" width="1660" height="170"/>
  <text class="section-title" x="100" y="594">3. 本地接收 type=stt 并分发到插件总线</text>
  <text class="section-note" x="100" y="614">目标：协议层收到服务端 JSON 后，经 Application 统一转发给插件。</text>

  <rect class="box amber" x="150" y="640" width="280" height="62"/>
  <text class="box-title" x="175" y="663">Protocol message handler</text>
  <text class="box-text" x="175" y="683">解析服务端 JSON</text>
  <rect class="box amber" x="525" y="640" width="300" height="62"/>
  <text class="box-title" x="550" y="663">Application._on_incoming_json()</text>
  <text class="box-text" x="550" y="683">记录: 收到JSON消息 type=stt</text>
  <rect class="box amber" x="920" y="640" width="315" height="62"/>
  <text class="box-title" x="945" y="663">PluginManager.notify_incoming_json()</text>
  <text class="box-text" x="945" y="683">广播给所有插件</text>
  <rect class="box amber" x="1330" y="640" width="245" height="62"/>
  <text class="box-title" x="1355" y="663">插件按 type 消费</text>
  <text class="box-text" x="1355" y="683">STT Adapter 只关心 type=stt</text>

  <path class="arrow" d="M430 671 H525"/>
  <path class="arrow" d="M825 671 H920"/>
  <path class="arrow" d="M1235 671 H1330"/>
  <path class="arrow-green" d="M1452 702 V765"/>

  <!-- Section 4 -->
  <rect class="section" x="70" y="765" width="1660" height="150"/>
  <text class="section-title" x="100" y="799">4. Adapter：提取文字并交给其他模块</text>
  <text class="section-note" x="100" y="819">目标：把服务端 STT JSON 变成模块可直接消费的 text 字符串。</text>

  <rect class="box adapter" x="140" y="840" width="300" height="62"/>
  <text class="box-title" x="165" y="863">SttForwarderPlugin</text>
  <text class="box-text" x="165" y="883">过滤 message.type == "stt"</text>
  <rect class="box adapter" x="530" y="840" width="270" height="62"/>
  <text class="box-title" x="555" y="863">提取 text</text>
  <text class="box-text" x="555" y="883">strip / 保存 last_text</text>
  <rect class="box adapter" x="890" y="840" width="270" height="62"/>
  <text class="box-title" x="915" y="863">Adapter 输出接口</text>
  <text class="box-text" x="915" y="883">listener / queue / last_text</text>
  <rect class="box red" x="1250" y="830" width="330" height="82"/>
  <text class="box-title" x="1275" y="853">其他业务模块</text>
  <text class="box-text" x="1275" y="873">add_listener(callback)</text>
  <text class="box-text" x="1275" y="892">subscribe_queue() / get_last_text()</text>

  <path class="arrow-green" d="M440 871 H530"/>
  <path class="arrow-green" d="M800 871 H890"/>
  <path class="arrow-green" d="M1160 871 H1250"/>

  <text class="label" x="128" y="945">终端查看点：SttForwarderPlugin 可打印 “语音转文字结果: ...”；原始成功标志仍是 “收到JSON消息: type=stt”。</text>
</svg>
