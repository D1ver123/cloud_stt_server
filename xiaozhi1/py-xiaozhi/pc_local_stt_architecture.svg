<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 34px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 16px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #667085; }
      .layer-title { font: 700 18px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #263247; }
      .box-title { font: 700 17px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .box-text { font: 400 13px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #4b5565; }
      .note-text { font: 400 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #667085; }
      .pill-text { font: 600 12px "Segoe UI", "Microsoft YaHei", Arial, sans-serif; fill: #344054; }
      .layer { fill: #ffffff; stroke: #d7dce5; stroke-width: 1.5; rx: 16; }
      .box { fill: #ffffff; stroke: #aeb8c8; stroke-width: 1.4; rx: 12; filter: url(#shadow); }
      .box-blue { fill: #eef6ff; stroke: #7bb7f0; }
      .box-green { fill: #eefaf2; stroke: #7ccf98; }
      .box-amber { fill: #fff7e8; stroke: #f0bc62; }
      .box-purple { fill: #f4f0ff; stroke: #a996e8; }
      .box-red { fill: #fff1f2; stroke: #ee8d9a; }
      .box-gray { fill: #f8fafc; stroke: #b8c2d0; }
      .arrow { stroke: #48566a; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #8a94a6; stroke-width: 1.8; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow-soft); }
      .bus { stroke: #5870a8; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
      .divider { stroke: #e3e7ee; stroke-width: 1; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#48566a"/>
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#8a94a6"/>
    </marker>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#5870a8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1000"/>
  <text class="title" x="70" y="66">PC 本地 STT 模式架构图</text>
  <text class="subtitle" x="70" y="96">本地完成麦克风采集、VAD 切句、模型识别、文本后处理与结果分发</text>

  <rect class="layer" x="50" y="130" width="1500" height="120"/>
  <text class="layer-title" x="78" y="164">1. 设备接入层</text>
  <rect class="box box-blue" x="115" y="178" width="210" height="54"/>
  <text class="box-title" x="140" y="201">PC 输入设备</text>
  <text class="box-text" x="140" y="221">USB 麦克风输入</text>
  <rect class="box box-blue" x="405" y="166" width="250" height="78"/>
  <text class="box-title" x="430" y="191">AudioDeviceAdapter</text>
  <text class="box-text" x="430" y="212">设备枚举、选择、打开、关闭</text>
  <text class="box-text" x="430" y="231">统一输出 PCM chunk</text>
  <rect class="box box-blue" x="735" y="166" width="230" height="78"/>
  <text class="box-title" x="760" y="191">AudioCapture</text>
  <text class="box-text" x="760" y="212">sounddevice / PyAudio</text>
  <text class="box-text" x="760" y="231">20ms / 30ms 音频块</text>
  <path class="arrow" d="M325 205 H405"/>
  <path class="arrow" d="M655 205 H735"/>

  <rect class="layer" x="50" y="285" width="1500" height="155"/>
  <text class="layer-title" x="78" y="319">2. 音频标准化与缓存层</text>
  <rect class="box box-green" x="115" y="338" width="230" height="76"/>
  <text class="box-title" x="140" y="363">AudioNormalizer</text>
  <text class="box-text" x="140" y="384">重采样到 16kHz</text>
  <text class="box-text" x="140" y="403">单声道 / int16 或 float32</text>
  <rect class="box box-green" x="430" y="338" width="225" height="76"/>
  <text class="box-title" x="455" y="363">AudioRingBuffer</text>
  <text class="box-text" x="455" y="384">前置缓存 300ms</text>
  <text class="box-text" x="455" y="403">保留句首，便于调试回放</text>
  <rect class="box box-green" x="740" y="338" width="240" height="76"/>
  <text class="box-title" x="765" y="363">AudioPreprocessor</text>
  <text class="box-text" x="765" y="384">降噪 / 增益 / AEC 可选</text>
  <text class="box-text" x="765" y="403">输出干净 PCM</text>
  <rect class="box box-green" x="1065" y="338" width="250" height="76"/>
  <text class="box-title" x="1090" y="363">SpeechBuffer</text>
  <text class="box-text" x="1090" y="384">缓存当前语句音频</text>
  <text class="box-text" x="1090" y="403">speech_start 到 speech_end</text>
  <path class="arrow" d="M850 244 V288 H230 V338"/>
  <path class="arrow" d="M345 376 H430"/>
  <path class="arrow" d="M655 376 H740"/>
  <path class="arrow" d="M980 376 H1065"/>

  <rect class="layer" x="50" y="475" width="1500" height="150"/>
  <text class="layer-title" x="78" y="509">3. VAD 切句与会话控制层</text>
  <rect class="box box-amber" x="115" y="528" width="245" height="76"/>
  <text class="box-title" x="140" y="553">VAD EndpointDetector</text>
  <text class="box-text" x="140" y="574">FSMN-VAD</text>
  <text class="box-text" x="140" y="593">输出 start / active / end</text>
  <rect class="box box-amber" x="440" y="528" width="240" height="76"/>
  <text class="box-title" x="465" y="553">UtteranceSegmenter</text>
  <text class="box-text" x="465" y="574">静音阈值 / 最短语音 / 超时</text>
  <text class="box-text" x="465" y="593">形成一句完整语音</text>
  <rect class="box box-amber" x="760" y="528" width="270" height="76"/>
  <text class="box-title" x="785" y="553">STTSessionManager</text>
  <text class="box-text" x="785" y="574">session_id / trace_id</text>
  <text class="box-text" x="785" y="593">Idle / Recognizing / Finalizing</text>
  <rect class="box box-amber" x="1110" y="528" width="250" height="76"/>
  <text class="box-title" x="1135" y="553">STTStreamController</text>
  <text class="box-text" x="1135" y="574">feed_audio / finalize / reset</text>
  <text class="box-text" x="1135" y="593">管理 partial 与 final</text>
  <path class="arrow" d="M860 414 V450 H238 V528"/>
  <path class="arrow" d="M360 566 H440"/>
  <path class="arrow" d="M680 566 H760"/>
  <path class="arrow" d="M1030 566 H1110"/>
  <path class="arrow-soft" d="M1190 414 V528"/>

  <rect class="layer" x="50" y="660" width="1500" height="150"/>
  <text class="layer-title" x="78" y="694">4. 本地 STT 引擎层</text>
  <rect class="box box-purple" x="150" y="713" width="260" height="76"/>
  <text class="box-title" x="175" y="738">LocalSTTEngine 接口</text>
  <text class="box-text" x="175" y="759">统一封装不同模型</text>
  <text class="box-text" x="175" y="778">支持整句或伪流式识别</text>
  <rect class="box box-purple" x="515" y="705" width="205" height="92"/>
  <text class="box-title" x="540" y="731">FunASR + SenseVoice</text>
  <text class="box-text" x="540" y="771">可结合流式或 VAD</text>
  <rect class="box box-purple" x="870" y="705" width="205" height="92"/>
  <text class="box-title" x="915" y="751">未来其他模型</text>
  <rect class="box box-purple" x="1250" y="705" width="205" height="92"/>
  <text class="box-title" x="1275" y="731">Raw Transcript</text>
  <text class="box-text" x="1275" y="752">partial text</text>
  <text class="box-text" x="1275" y="771">final text</text>
  <path class="arrow" d="M1235 604 V636 H280 V713"/>
  <path class="arrow" d="M410 751 H515"/>
  <path class="arrow" d="M410 751 H870"/>

  <path class="arrow" d="M1075 751 H1250"/>


  <rect class="layer" x="50" y="845" width="1500" height="115"/>
  <text class="layer-title" x="78" y="879">5. 文本后处理与结果输出层</text>
  <rect class="box box-red" x="150" y="894" width="245" height="50"/>
  <text class="box-title" x="175" y="916">TextPostProcessor</text>
  <text class="box-text" x="175" y="935">标点 / 热词 / 纠错 / 归一化</text>
  <rect class="box box-red" x="485" y="894" width="220" height="50"/>
  <text class="box-title" x="510" y="916">ResultRouter</text>
  <text class="box-text" x="510" y="935">结果分发与事件通知</text>
  <rect class="box box-red" x="795" y="894" width="205" height="50"/>
  <text class="box-title" x="820" y="916">Adapter</text>
  <text class="box-text" x="820" y="935">发送到具体接收端</text>
  <rect class="box box-gray" x="1085" y="886" width="320" height="66"/>
  <text class="box-title" x="1110" y="911">输出目标</text>
  <text class="box-text" x="1110" y="932">控制台 / GUI 字幕 / 文件 / API / 机器人控制</text>
  <path class="arrow" d="M1362 798 V829 H272 V894"/>
  <path class="arrow" d="M395 919 H485"/>
  <path class="arrow" d="M705 919 H795"/>
  <path class="arrow" d="M1000 919 H1085"/>


  <rect x="70" y="730" width="32" height="32" rx="16" fill="#7e6bdc"/>
  <text x="80" y="752" font-family="Segoe UI, Microsoft YaHei, Arial" font-size="18" font-weight="700" fill="#fff">STT</text>
</svg>
